    <circle cx="352" cy="92" r="2"/>
    <circle cx="532" cy="126" r="2"/>
    <circle cx="642" cy="73" r="2"/>
    <circle cx="980" cy="104" r="2"/>
    <circle cx="1314" cy="110" r="2"/>
