  <g fill="#04101e" opacity=".96">
    <path d="M0 642 86 616 128 628 188 596 258 625 320 603 388 640 460 615 535 651V720H0Z"/>
    <path d="M1085 650 1150 615 1220 636 1285 607 1360 640 1425 598 1495 630 1600 590V720H1085Z"/>
  </g>

  <g fill="#e7d5cc" opacity=".7">
    <circle cx="1208" cy="186" r="34"/>
