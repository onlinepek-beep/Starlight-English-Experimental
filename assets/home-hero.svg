<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182d63"/>
      <stop offset=".38" stop-color="#4d4c8a"/>
      <stop offset=".68" stop-color="#d67891"/>
      <stop offset="1" stop-color="#f0bdab"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".74" cy=".33" r=".28">
      <stop offset="0" stop-color="#ffe7b7" stop-opacity=".9"/>
      <stop offset=".32" stop-color="#ffd8c1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffd8c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c7ca5"/>
      <stop offset="1" stop-color="#3b466f"/>
    </linearGradient>
    <linearGradient id="midMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e456e"/>
      <stop offset="1" stop-color="#171f3d"/>
    </linearGradient>
    <linearGradient id="frontMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233e"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18355d"/>
      <stop offset="1" stop-color="#061321"/>
    </linearGradient>
    <filter id="atmo" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#sunGlow)"/>

  <g opacity=".26" filter="url(#atmo)">
    <path d="M0 260 150 170 300 235 445 90 610 210 770 72 935 218 1110 128 1265 238 1450 125 1600 208V430H0Z" fill="#a8afd4"/>
  </g>

  <g opacity=".84">
