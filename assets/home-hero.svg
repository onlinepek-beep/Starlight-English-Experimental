    <path d="m470 155 38 60 50 42-64-23-46 18Z" fill="#d8d5df" opacity=".6"/>
    <path d="m780 128 45 70 48 44-68-28-50 16Z" fill="#e2dfe5" opacity=".55"/>
    <path d="m1450 174 42 66 45 40-62-23-46 16Z" fill="#e6e1e6" opacity=".48"/>
  </g>

  <path d="M0 430 190 294 360 408 540 225 720 394 900 207 1060 386 1240 236 1400 395 1600 230V545H0Z" fill="url(#midMountains)"/>
  <path d="M0 500 165 358 335 492 505 278 670 470 845 300 1015 466 1190 318 1340 470 1500 312 1600 387V585H0Z" fill="url(#frontMountains)"/>

  <rect y="500" width="1600" height="220" fill="url(#lake)"/>

  <g opacity=".22" stroke="#f3b8bb" stroke-linecap="round">
    <path d="M860 542h270" stroke-width="7"/>
    <path d="M895 558h210" stroke-width="5"/>
    <path d="M918 576h165" stroke-width="4"/>
    <path d="M936 594h130" stroke-width="3"/>
  </g>

  <g opacity=".14" stroke="#9ab8dd" stroke-linecap="round">
    <path d="M180 548h360" stroke-width="3"/>
